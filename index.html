<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#A81433">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Béton TG</title>
</head>
<body>
<header>
  <img src="icons/tg-prefa-logo.png" alt="TG PREFA" class="logo">
  <h1>BETON TG PREFA</h1>
</header>


<main>
<section id="welcome" class="card">
  <div class="langbar">
    <button class="lang active" onclick="setLanguage('fr')">FR</button>
    <button class="lang" onclick="setLanguage('ar')">ع</button>
  </div>
  <h2 data-fr="Bienvenue" data-ar="مرحباً بك">Bienvenue</h2>
  <p data-fr="BETON TG PREFA" data-ar="BETON TG PREFA">BETON TG PREFA</p>
  <button onclick="showLogin()" data-fr="🔑 Se connecter" data-ar="🔑 تسجيل الدخول">🔑 Se connecter</button>
  <button class="secondary" onclick="showRegister()" data-fr="➕ Créer un compte" data-ar="➕ إنشاء حساب">➕ Créer un compte</button>
</section>

<section id="login" class="card hidden">
  <div class="langbar"><button class="lang active" onclick="setLanguage('fr')">FR</button><button class="lang" onclick="setLanguage('ar')">ع</button></div>
  <h2 data-fr="🔑 Se connecter" data-ar="🔑 تسجيل الدخول">🔑 Se connecter</h2>
  <label data-fr="Centre" data-ar="المركز">Centre</label>
  <select id="loginCenter"></select>
  <label data-fr="PIN (4 chiffres)" data-ar="الرقم السري (4 أرقام)">PIN (4 chiffres)</label>
  <input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button onclick="login()" data-fr="Se connecter" data-ar="دخول">Se connecter</button>
  <button class="linkbtn" onclick="showWelcome()" data-fr="← Retour" data-ar="← رجوع">← Retour</button>
  <p id="loginMsg" class="msg"></p>
</section>

<section id="register" class="card hidden">
  <div class="langbar"><button class="lang active" onclick="setLanguage('fr')">FR</button><button class="lang" onclick="setLanguage('ar')">ع</button></div>
  <h2 data-fr="➕ Créer un compte centre" data-ar="➕ إنشاء حساب مركز">➕ Créer un compte centre</h2>
  <label data-fr="Nom du centre" data-ar="اسم المركز">Nom du centre</label>
  <input id="registerCenter" placeholder="Ex. CAB OULAD SALEH">
  <label data-fr="PIN (4 chiffres)" data-ar="الرقم السري (4 أرقام)">PIN (4 chiffres)</label>
  <input id="registerPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <label data-fr="Confirmer le PIN" data-ar="تأكيد الرقم السري">Confirmer le PIN</label>
  <input id="registerPin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button onclick="register()" data-fr="Créer le compte" data-ar="إنشاء الحساب">Créer le compte</button>
  <button class="linkbtn" onclick="showWelcome()" data-fr="← Retour" data-ar="← رجوع">← Retour</button>
  <p id="registerMsg" class="msg"></p>
</section>

<section id="home" class="hidden">
  <div class="topbar">
    <strong id="currentCenter"></strong>
    <div>
      <button class="lang active" onclick="setLanguage('fr')">FR</button>
      <button class="lang" onclick="setLanguage('ar')">ع</button>
      <button class="logout" onclick="logout()" data-fr="Déconnexion" data-ar="تسجيل الخروج">Déconnexion</button>
    </div>
  </div>
  <div class="grid">
    <button class="module" onclick="openCalcul()">🧮<span data-fr="Calcul des matières premières" data-ar="حساب المواد الأولية">Calcul des matières premières</span></button>
    <button class="module">📦<span data-fr="Stock" data-ar="المخزون">Stock</span></button>
    <button class="module">🏭<span data-fr="Production" data-ar="الإنتاج">Production</span></button>
    <button class="module">📋<span data-fr="Commandes" data-ar="الطلبات">Commandes</span></button>
    <button class="module">🚚<span data-fr="Camions" data-ar="الشاحنات">Camions</span></button>
    <button class="module">👥<span data-fr="Clients" data-ar="العملاء">Clients</span></button>
    <button class="module">💰<span data-fr="Dépenses" data-ar="المصاريف">Dépenses</span></button>
    <button class="module">📊<span data-fr="Rapports" data-ar="التقارير">Rapports</span></button>
    <button class="module" onclick="openFormules()">⚙️<span data-fr="Formules & Densités" data-ar="الفورمول والكثافات">Formules & Densités</span></button>
  </div>
</section>

<section id="calcul" class="card hidden">
  <div class="sectionhead">
    <h2 data-fr="🧮 Calcul des matières premières" data-ar="🧮 حساب المواد الأولية">🧮 Calcul des matières premières</h2>
    <button class="small" onclick="openHome()" data-fr="← Accueil" data-ar="← الرئيسية">← Accueil</button>
  </div>
  <label data-fr="Type de béton" data-ar="نوع الخرسانة">Type de béton</label>
  <select id="type"></select>
  <label data-fr="Quantité de béton demandée (m³)" data-ar="كمية الخرسانة المطلوبة (m³)">Quantité de béton demandée (m³)</label>
  <input id="qty" type="number" min="0" step="0.01" value="10">
  <button onclick="calculate()" data-fr="🧮 Calculer" data-ar="🧮 احسب">🧮 Calculer</button>
  <div id="calcMsg" class="msg"></div>
  <table>
    <thead><tr><th data-fr="Matière" data-ar="المادة">Matière</th><th data-fr="Quantité" data-ar="الكمية">Quantité</th><th data-fr="Volume" data-ar="الحجم">Volume</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
</section>

<section id="formules" class="card hidden">
  <div class="sectionhead">
    <h2 data-fr="⚙️ Formules & Densités" data-ar="⚙️ الفورمول والكثافات">⚙️ Formules & Densités</h2>
    <button class="small" onclick="openHome()" data-fr="← Accueil" data-ar="← الرئيسية">← Accueil</button>
  </div>
  <label data-fr="Type de béton" data-ar="نوع الخرسانة">Type de béton</label>
  <select id="formulaType" onchange="renderFormula()"></select>
  <h3 data-fr="Dosages de la formule — kg/m³" data-ar="جرعات الفورمول — kg/m³">Dosages de la formule — kg/m³</h3>
  <div class="formgrid">
    <label>G1<input id="G1" type="number" step="0.1"></label>
    <label>G2<input id="G2" type="number" step="0.1"></label>
    <label>SL<input id="SL" type="number" step="0.1"></label>
    <label>SC<input id="SC" type="number" step="0.1"></label>
    <label>Ciment<input id="Ciment" type="number" step="0.1"></label>
    <label>Adjuvant<input id="Adjuvant" type="number" step="0.1"></label>
    <label>Eau<input id="Eau" type="number" step="0.1"></label>
  </div>
  <h3 data-fr="Densités — kg/m³" data-ar="الكثافات — kg/m³">Densités — kg/m³</h3>
  <div class="formgrid">
    <label>G1<input id="D_G1" type="number" step="1"></label>
    <label>G2<input id="D_G2" type="number" step="1"></label>
    <label>SL<input id="D_SL" type="number" step="1"></label>
    <label>SC<input id="D_SC" type="number" step="1"></label>
  </div>
  <button onclick="addFormula()" data-fr="➕ Ajouter une formule" data-ar="➕ إضافة فورمول">➕ Ajouter une formule</button>
  <button class="secondary" onclick="saveFormula()" data-fr="💾 Enregistrer" data-ar="💾 حفظ">💾 Enregistrer</button>
  <button class="danger" onclick="deleteFormula()" data-fr="🗑️ Supprimer la formule" data-ar="🗑️ حذف الفورمول">🗑️ Supprimer la formule</button>
  <p class="hint" data-fr="Les modifications ne sont enregistrées qu'après validation avec le PIN du centre."
     data-ar="لن يتم حفظ التعديلات إلا بعد تأكيدها بالرقم السري للمركز.">Les modifications ne sont enregistrées qu'après validation avec le PIN du centre.</p>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
